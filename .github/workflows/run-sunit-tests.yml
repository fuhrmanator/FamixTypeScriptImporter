name: Pharo/Moose Tests

on:
  push:
    branches: [ master, merge-importer-tests ]
  pull_request:
    branches: [ master, merge-importer-tests ]

jobs:
  test:
    name: Run Pharo/Moose Tests
    runs-on: ubuntu-latest

    env:
      MODEL_JSON_PATH: ${{ github.workspace }}/.github/ImporterSampleProject/JSONModels/model.json

    steps:
      # 1. Checkout ts2famix repository
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # cache: 'npm'

      # 3. Install dependencies
      - name: Build and Install Dependencies
        run: npm ci
      - run: npm run build
      - run: npm run test

      # 4. Use npx to install ts2famix and generate the model.json from your src/ folder
      - name: Generate Model JSON
        run: |
          mkdir -p $GITHUB_WORKSPACE/.github/ImporterSampleProject/JSONModels

          npx ts2famix -i $GITHUB_WORKSPACE/.github/ImporterSampleProject/tsconfig.json -o ${{ env.MODEL_JSON_PATH }}

      # 5. Set up smalltalk-ci and run the tests using Moose 13
      - name: Setup SmalltalkCI
        uses: hpi-swa/setup-smalltalkCI@v1
        id: smalltalkci
        with:
          smalltalk-image: 'Moose64-13'

      - name: Run Pharo/Moose Tests
        run: |
          echo "MODEL_JSON_PATH=$MODEL_JSON_PATH"

          smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }} .github/pharo-setup.smalltalk.ston
        shell: bash
        timeout-minutes: 15